<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quản lý Category (AJAX)</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 text-primary fw-bold">
                <i class="fa-solid fa-list-check me-2"></i>Quản lý Danh Mục (Category - AJAX)
            </h4>
            <button class="btn btn-success" onclick="showCreateNewCategoryModal()">
                <i class="fa-solid fa-plus me-1"></i> Thêm Category Ajax
            </button>
        </div>

        <div class="card-body">
            <!-- SEARCH AND FILTER BAR -->
            <div class="row g-3 mb-3">
                <div class="col-md-6 col-lg-4">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="searchName" class="form-control" placeholder="Tìm kiếm theo tên danh mục...">
                        <button class="btn btn-outline-secondary" type="button" id="btnSearch">Tìm kiếm</button>
                        <button class="btn btn-outline-danger" type="button" id="btnClear">Xóa</button>
                    </div>
                </div>
                <div class="col-md-3 col-lg-2 ms-auto">
                    <div class="input-group">
                        <span class="input-group-text bg-white">Hiển thị</span>
                        <select id="pageSize" class="form-select">
                            <option value="5" selected>5</option>
                            <option value="10">10</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- TABLE CATEGORY -->
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle border" id="categoryTable">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 80px;">Id</th>
                            <th style="width: 120px;">Icon</th>
                            <th>Name</th>
                            <th style="width: 150px;" class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="categoryTableBody">
                        <!-- AJAX rendered items -->
                    </tbody>
                </table>
            </div>

            <!-- PAGINATION AND INFO -->
            <div class="d-flex justify-content-between align-items-center mt-3">
                <div id="pageInfo" class="text-muted small"></div>
                <nav>
                    <ul class="pagination pagination-sm mb-0" id="paginationControls">
                        <!-- AJAX rendered pagination links -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- MODAL ADD CATEGORY -->
    <div class="modal fade" tabindex="-1" role="dialog" id="createCategoryModal">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <form id="addCategory" method="post" enctype="multipart/form-data">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title"><i class="fa-solid fa-folder-plus me-2"></i>Thêm Danh Mục Mới</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="new_categoryname" class="form-label fw-bold">Tên Danh Mục <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="new_categoryname" name="categoryName" required placeholder="Nhập tên danh mục...">
                        </div>
                        <div class="mb-3">
                            <label for="new_icon" class="form-label fw-bold">Biểu Tượng (Icon / Image)</label>
                            <input type="file" class="form-control" id="new_icon" name="icon" accept="image/*">
                            <small class="text-muted">Chọn file hình ảnh (.png, .jpg, .jpeg)</small>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk me-1"></i> Thêm</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL UPDATE CATEGORY -->
    <div class="modal fade" tabindex="-1" role="dialog" id="updateCategoryInfoModal">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fa-solid fa-pen-to-square me-2"></i>Cập Nhật Danh Mục</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="card mb-3 bg-light border-0">
                        <div class="card-body py-2">
                            <p class="mb-1 fw-bold text-secondary" id="updateCategoryInfoModalId">Category ID: </p>
                            <p class="mb-1" id="updateCategoryInfoModalName">Category Name: </p>
                            <p class="mb-0" id="updateCategoryInfoModalIcon">Icon: </p>
                        </div>
                    </div>

                    <form id="updateCategory" method="post" enctype="multipart/form-data">
                        <input type="hidden" id="categoryId_up" name="categoryId">
                        <div class="mb-3">
                            <label for="categoryName_up" class="form-label fw-bold">Tên Danh Mục <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="categoryName_up" name="categoryName" required>
                        </div>
                        <div class="mb-3">
                            <label for="icon_up" class="form-label fw-bold">Thay Đổi Icon</label>
                            <input type="file" class="form-control" id="icon_up" name="icon" accept="image/*">
                            <small class="text-muted">Để trống nếu muốn giữ nguyên icon hiện tại</small>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check me-1"></i> Cập nhật</button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script type="text/javascript">
var currentPage = 0;
var pageSize = 5;
var searchKeyword = '';

$(document).ready(function() {
    loadCategories(0);

    // Tìm kiếm
    $('#btnSearch').click(function() {
        searchKeyword = $('#searchName').val().trim();
        currentPage = 0;
        loadCategories(currentPage);
    });

    $('#searchName').keypress(function(e) {
        if (e.which === 13) {
            $('#btnSearch').click();
        }
    });

    $('#btnClear').click(function() {
        $('#searchName').val('');
        searchKeyword = '';
        currentPage = 0;
        loadCategories(0);
    });

    $('#pageSize').change(function() {
        pageSize = parseInt($(this).val());
        currentPage = 0;
        loadCategories(0);
    });

    // Thêm Category bằng AJAX FormData
    $('form#addCategory').submit(function(e) {
        e.preventDefault();
        var formData = new FormData(this);
        $.ajax({
            url: contextPath + '/api/category/addCategory',
            type: 'POST',
            dataType: 'json',
            data: formData,
            cache: false,
            contentType: false,
            processData: false,
            success: function(res) {
                if (res.status) {
                    $('#createCategoryModal').modal('hide');
                    $('form#addCategory')[0].reset();
                    showNotification(res.message || 'Thêm thành công!', true);
                    loadCategories(currentPage);
                } else {
                    showNotification(res.message || 'Thêm thất bại!', false);
                }
            },
            error: function(xhr) {
                var msg = 'Đã có lỗi xảy ra!';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    msg = xhr.responseJSON.message;
                }
                showNotification(msg, false);
            }
        });
    });

    // Cập nhật Category bằng AJAX FormData
    $('form#updateCategory').submit(function(e) {
        e.preventDefault();
        var formData = new FormData(this);
        $.ajax({
            url: contextPath + '/api/category/updateCategory',
            type: 'POST',
            dataType: 'json',
            data: formData,
            cache: false,
            contentType: false,
            processData: false,
            success: function(res) {
                if (res.status) {
                    $('#updateCategoryInfoModal').modal('hide');
                    showNotification(res.message || 'Cập nhật thành công!', true);
                    loadCategories(currentPage);
                } else {
                    showNotification(res.message || 'Cập nhật thất bại!', false);
                }
            },
            error: function(xhr) {
                var msg = 'Lỗi cập nhật!';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    msg = xhr.responseJSON.message;
                }
                showNotification(msg, false);
            }
        });
    });

    // Xóa Category bằng AJAX
    $(document).delegate('.btn-delete-cat', 'click', function(e) {
        e.preventDefault();
        var id = $(this).data('id');
        var name = $(this).data('name');
        if (confirm('Bạn có chắc chắn muốn xóa danh mục "' + name + '" (ID: ' + id + ') không?')) {
            $.ajax({
                type: 'DELETE',
                url: contextPath + '/api/category/deleteCategory?categoryId=' + id,
                dataType: 'json',
                success: function(res) {
                    if (res.status) {
                        showNotification(res.message || 'Xóa thành công!', true);
                        loadCategories(currentPage);
                    } else {
                        showNotification(res.message || 'Xóa thất bại!', false);
                    }
                },
                error: function(xhr) {
                    var msg = 'Không thể xóa danh mục này!';
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        msg = xhr.responseJSON.message;
                    }
                    showNotification(msg, false);
                }
            });
        }
    });

    // Bấm nút sửa
    $(document).delegate('.btn-edit-cat', 'click', function(e) {
        e.preventDefault();
        var id = $(this).data('id');
        var name = $(this).data('name');
        var icon = $(this).data('icon');
        showEditCategoryModal(id, name, icon);
    });
});

function loadCategories(page) {
    currentPage = page;
    $.ajax({
        url: contextPath + '/api/category/paginated',
        type: 'GET',
        data: {
            name: searchKeyword,
            page: page,
            size: pageSize,
            sort: 'categoryId',
            dir: 'desc'
        },
        dataType: 'json',
        success: function(response) {
            var pageData = response.body;
            var items = pageData ? pageData.content : [];
            var totalPages = pageData ? pageData.totalPages : 0;
            var totalElements = pageData ? pageData.totalElements : 0;

            renderCategoryTable(items);
            renderPagination(totalPages, page, totalElements);
        },
        error: function(xhr) {
            console.error('Lỗi khi tải danh sách category:', xhr);
            $('#categoryTableBody').html('<tr><td colspan="4" class="text-center text-danger">Không thể tải dữ liệu</td></tr>');
        }
    });
}

function renderCategoryTable(items) {
    var tbody = $('#categoryTableBody');
    tbody.empty();
    if (!items || items.length === 0) {
        tbody.append('<tr><td colspan="4" class="text-center py-4 text-muted">Không tìm thấy danh mục nào</td></tr>');
        return;
    }
    for (var i = 0; i < items.length; i++) {
        var cat = items[i];
        var iconHtml = cat.icon
            ? '<img src="' + contextPath + '/admin/categories/images/' + cat.icon + '" style="width:50px; height:50px;" class="img-thumbnail" alt="icon">'
            : '<span class="badge bg-secondary">No Icon</span>';

        var tr = $('<tr></tr>');
        tr.append('<td><strong>' + cat.categoryId + '</strong></td>');
        tr.append('<td>' + iconHtml + '</td>');
        tr.append('<td>' + cat.categoryName + '</td>');
        tr.append('<td class="text-center action-btns">' +
            '<button class="btn btn-sm btn-outline-warning btn-edit-cat" data-id="' + cat.categoryId + '" data-name="' + cat.categoryName + '" data-icon="' + (cat.icon || '') + '"><i class="fa fa-edit"></i></button> ' +
            '<button class="btn btn-sm btn-outline-danger btn-delete-cat" data-id="' + cat.categoryId + '" data-name="' + cat.categoryName + '"><i class="fa fa-trash"></i></button>' +
            '</td>');
        tbody.append(tr);
    }
}

function renderPagination(totalPages, page, totalElements) {
    var controls = $('#paginationControls');
    controls.empty();

    var startItem = totalElements === 0 ? 0 : page * pageSize + 1;
    var endItem = Math.min((page + 1) * pageSize, totalElements);
    $('#pageInfo').text('Hiển thị từ ' + startItem + ' đến ' + endItem + ' của ' + totalElements + ' danh mục');

    if (totalPages <= 1) return;

    // Nút Previous
    var prevDisabled = page === 0 ? ' disabled' : '';
    controls.append('<li class="page-item' + prevDisabled + '"><a class="page-link" href="#" onclick="loadCategories(' + (page - 1) + '); return false;">&laquo; Trước</a></li>');

    // Các số trang
    for (var i = 0; i < totalPages; i++) {
        var activeClass = i === page ? ' active' : '';
        controls.append('<li class="page-item' + activeClass + '"><a class="page-link" href="#" onclick="loadCategories(' + i + '); return false;">' + (i + 1) + '</a></li>');
    }

    // Nút Next
    var nextDisabled = page >= totalPages - 1 ? ' disabled' : '';
    controls.append('<li class="page-item' + nextDisabled + '"><a class="page-link" href="#" onclick="loadCategories(' + (page + 1) + '); return false;">Sau &raquo;</a></li>');
}

function showCreateNewCategoryModal() {
    $('#new_categoryname').val('');
    $('#new_icon').val('');
    $('#createCategoryModal').modal('show');
}

function showEditCategoryModal(categoryId, categoryName, icon) {
    $('#updateCategoryInfoModalId').text('Category ID: ' + categoryId);
    $('#updateCategoryInfoModalName').text('Category Name: ' + categoryName);
    $('#updateCategoryInfoModalIcon').text('Icon: ' + (icon ? icon : 'Chưa có'));

    $('#categoryId_up').val(categoryId);
    $('#categoryName_up').val(categoryName);
    $('#icon_up').val('');
    $('#updateCategoryInfoModal').modal('show');
}
</script>
</th:block>
</body>
</html>
