# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8082

# ===============================
# APPLICATION NAME
# ===============================
spring.application.name=project08

# ===============================
# THYMELEAF CONFIGURATION
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===============================
# FILE UPLOAD (MULTIPART)
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# STORAGE PROPERTIES
# ===============================
storage.location=uploads

# ===============================
# DATABASE CONFIGURATION (DEFAULT: H2 IN-MEMORY)
# ===============================
spring.datasource.url=jdbc:h2:mem:webprog_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# ALTERNATIVE: MYSQL CONFIGURATION (Uncomment to use MySQL)
# ===============================
# spring.datasource.url=jdbc:mysql://localhost:3306/webprog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=123456
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ===============================
# ALTERNATIVE: SQL SERVER CONFIGURATION (Uncomment to use MSSQL)
# ===============================
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=webst2;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8
# spring.datasource.username=sa
# spring.datasource.password=1234567@a$
# spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SWAGGER / OPENAPI 3
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs

